name: Build projects.json

on:
  push:
    branches: [ main ]
    paths:
      - "(2025_2) Fall 2025/README.md"
      - ".github/workflows/build-projects.yml"

  schedule:
    # run every 12 hours
    - cron: "17 */12 * * *"

  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: build-projects-json
  cancel-in-progress: false


jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4


      - name: Generate projects.json for Fall 2025
        uses: actions/github-script@v7
        with:
          script: |

            const fs = require('fs');

            const semesterPath = "(2025_2) Fall 2025";
            const md = fs.readFileSync(`${semesterPath}/README.md`, "utf8");

            const links = Array.from(
              md.matchAll(/https?:\/\/github\.com\/([\w-]+)\/([\w.-]+)/g)
            ).map(m => ({
              owner: m[1],
              name: m[2],
              url: m[0]
            }));


            const seen = new Set();

            const repos = links.filter(r => {
              const key = `${r.owner}/${r.name}`;
              if (seen.has(key)) return false;
              seen.add(key);
              return true;
            });


            const out = [];

            for (const r of repos) {

              try {

                const meta = await github.request(
                  'GET /repos/{owner}/{repo}',
                  {
                    owner: r.owner,
                    repo: r.name
                  }
                );


                let contribs = [];

                try {

                  const c = await github.request(
                    'GET /repos/{owner}/{repo}/contributors',
                    {
                      owner: r.owner,
                      repo: r.name,
                      per_page: 6
                    }
                  );

                  contribs = (c.data || []).map(u => ({
                    login: u.login,
                    avatar_url: u.avatar_url,
                    html_url: u.html_url
                  }));

                } catch (e) {
                  // contributors endpoint may fail for forks
                }


                out.push({
                  name: meta.data.name,
                  path: `${r.owner}/${r.name}`,
                  url: meta.data.html_url,
                  updatedAt: meta.data.pushed_at || meta.data.updated_at || null,
                  description: meta.data.description || "",
                  contributors: contribs
                });

              } catch (e) {

                out.push({
                  name: `${r.owner}/${r.name}`,
                  path: `${r.owner}/${r.name}`,
                  url: r.url,
                  updatedAt: null,
                  description: "",
                  contributors: []
                });

              }

            }


            out.sort((a, b) => a.name.localeCompare(b.name));


            fs.writeFileSync(
              `${semesterPath}/projects.json`,
              JSON.stringify(out, null, 2) + "\n",
              "utf8"
            );


      - name: Commit updated JSON
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update Fall 2025 projects.json"
          file_pattern: "(2025_2) Fall 2025/projects.json"
