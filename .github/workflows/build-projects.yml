name: Build projects.json

on:
  push:
    branches: [ main ]

  workflow_dispatch:

  schedule:
    - cron: "17 */12 * * *"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate JSON files
        uses: actions/github-script@v7
        with:
          script: |

            const fs = require('fs');

            const semesters = [
              "(2025_1) Summer 2025",
              "(2025_2) Fall 2025"
            ];

            for (const semesterPath of semesters) {

              const readmePath = `${semesterPath}/README.md`;

              if (!fs.existsSync(readmePath)) {
                console.log(`Skipping ${semesterPath}, no README`);
                continue;
              }

              const md = fs.readFileSync(readmePath, "utf8");

              const links = Array.from(
                md.matchAll(/https?:\/\/github\.com\/([\w-]+)\/([\w.-]+)/g)
              ).map(m => ({
                owner: m[1],
                name: m[2],
                url: m[0]
              }));

              const seen = new Set();

              const repos = links.filter(r => {
                const key = `${r.owner}/${r.name}`;
                if (seen.has(key)) return false;
                seen.add(key);
                return true;
              });

              const out = [];

              for (const r of repos) {

                try {

                  const meta = await github.request(
                    'GET /repos/{owner}/{repo}',
                    {
                      owner: r.owner,
                      repo: r.name
                    }
                  );

                  let contribs = [];

                  try {

                    const c = await github.request(
                      'GET /repos/{owner}/{repo}/contributors',
                      {
                        owner: r.owner,
                        repo: r.name,
                        per_page: 6
                      }
                    );

                    contribs = (c.data || []).map(u => ({
                      login: u.login,
                      avatar_url: u.avatar_url,
                      html_url: u.html_url
                    }));

                  } catch (e) {}

                  out.push({
                    name: meta.data.name,
                    path: `${r.owner}/${r.name}`,
                    url: meta.data.html_url,
                    updatedAt: meta.data.pushed_at || meta.data.updated_at || null,
                    description: meta.data.description || "",
                    contributors: contribs
                  });

                } catch (e) {

                  out.push({
                    name: `${r.owner}/${r.name}`,
                    path: `${r.owner}/${r.name}`,
                    url: r.url,
                    updatedAt: null,
                    description: "",
                    contributors: []
                  });

                }

              }

              out.sort((a,b)=>a.name.localeCompare(b.name));

              const outputPath = `${semesterPath}/projects.json`;

              fs.writeFileSync(
                outputPath,
                JSON.stringify(out, null, 2) + "\n",
                "utf8"
              );

              console.log(`Updated ${outputPath}`);

            }


      - name: Commit generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: update semester projects.json"
          file_pattern: "**/projects.json"
