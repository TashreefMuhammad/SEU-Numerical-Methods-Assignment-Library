
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Fall 2025 Numerical Methods Projects</title>
<style>
body{font-family:Arial;background:#f4f6fb;margin:40px}
h1{text-align:center}
.project{background:white;padding:15px;margin:10px;border-radius:8px;box-shadow:0 2px 8px rgba(0,0,0,0.1)}
a{color:#2c3e50;text-decoration:none;font-weight:bold}
</style>
</head>
<body>
<h1>Fall 2025 Numerical Methods Projects</h1>
<div id="projects"></div>

<script>
fetch('projects.json')
.then(r=>r.json())
.then(data=>{
const container=document.getElementById("projects");
data.projects.forEach(p=>{
const div=document.createElement("div");
div.className="project";
div.innerHTML=`<b>Group:</b> ${p.group}<br>
<b>Project:</b> ${p.title}<br>
<a href="${p.repo}" target="_blank">GitHub Repository</a>`;
container.appendChild(div);
});
});
</script>
</body>
</html>
